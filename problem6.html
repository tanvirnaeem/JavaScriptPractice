<!DOCTYPE html>
<html>

<head>
    <title>Age Classification</title>
</head>

<body>

<h2>Age Classification System</h2>
<label>Enter your age:</label>
<input type="number" id="age">
<button onclick="classifyAge()">
Check Category
</button>
<p id="result"></p>

<script>

function classifyAge()
{
    let age = document.getElementById("age").value;

    let category;

    if(age >=0 && age <=12)
    {
        category = "Child";
    }
    else if(age >=13 && age <=19)
    {
        category = "Teenager";
    }
    else if(age >=20 && age <=59)
    {
        category = "Adult";
    }
    else if(age >=60)
    {
        category = "Senior Citizen";
    }
    else
    {
        category = "Invalid Age";
    }

    document.getElementById("result").innerHTML = category;
}
</script>
</body>
</html>
