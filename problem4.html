<!DOCTYPE html>
<html>

<head>
<title>Student Result</title>
</head>
<body>
<h2>Student Result System</h2>
<div id="result"></div>
<script>

let studentName = "Rahim";
let mark1 = 85;
let mark2 = 75;
let mark3 = 90;
let total = mark1 + mark2 + mark3;
let average = total / 3;
let grade;

if(average >= 80)
{
    grade = "A+";
}
else if(average >= 70)
{
    grade = "A";
}
else if(average >= 60)
{
    grade = "B";
}
else if(average >= 50)
{
    grade = "C";
}
else if(average >= 40)
{
    grade = "D";
}
else
{
    grade = "F";
}
document.getElementById("result").innerHTML =

"Student Name: " + studentName + "<br>" +
"Total Marks: " + total + "<br>" +
"Average Marks: " + average.toFixed(2) + "<br>" +
"Grade: " + grade;
</script>
</body>
</html>
